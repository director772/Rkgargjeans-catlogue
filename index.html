<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RK Garg Jeans — Wholesale Catalog</title>
<meta property="og:title" content="RK Garg Jeans — Wholesale Catalog" />
<meta property="og:description" content="Wholesale catalog for G'Sir, LeBoys & Gargline." />
<style>
:root{--bg:#10141c;--panel:#171d29;--panel-2:#1e2635;--denim:#2c4a6e;--denim-light:#4c7aa8;
--stitch:#d4a24c;--stitch-dim:#8a6a30;--text:#eef1f6;--text-muted:#8f9bb0;--border:#29334a;
--danger:#c65b4e;--ok:#5fa87a;--radius:10px;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
button{font-family:inherit;cursor:pointer;}
.header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px dashed var(--stitch-dim);padding:14px 18px;}
.header-row{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto;}
.brandmark{display:flex;flex-direction:column;line-height:1.1;}
.brandmark .eyebrow{font-size:11px;letter-spacing:.14em;color:var(--stitch);text-transform:uppercase;}
.brandmark .name{font-size:19px;font-weight:700;}
.cart-btn{position:relative;background:var(--denim);color:var(--text);border:1px solid var(--denim-light);
border-radius:var(--radius);padding:9px 16px;font-size:14px;font-weight:600;}
.cart-btn .badge{position:absolute;top:-8px;right:-8px;background:var(--stitch);color:#241a04;font-size:11px;
font-weight:800;border-radius:999px;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.filters{max-width:1200px;margin:14px auto 0;padding:0 18px 14px;display:flex;gap:20px;flex-wrap:wrap;}
.filter-group{display:flex;flex-direction:column;gap:6px;}
.filter-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;}
.pill{border:1px solid var(--border);background:var(--panel-2);color:var(--text-muted);border-radius:999px;
padding:6px 13px;font-size:12.5px;font-weight:500;}
.pill.active{background:var(--denim);border-color:var(--denim-light);color:var(--text);}
.container{max-width:1200px;margin:0 auto;padding:20px 18px 80px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
text-align:left;padding:0;color:inherit;}
.card-img{width:100%;aspect-ratio:3/4;background:var(--panel-2);object-fit:cover;display:block;}
.card-body{padding:10px 12px 12px;}
.card-sku{font-size:13px;font-weight:700;}
.card-meta{font-size:11.5px;color:var(--text-muted);margin-top:3px;}
.card-moq{display:inline-block;margin-top:7px;font-size:10.5px;border:1px solid var(--stitch-dim);
color:var(--stitch);border-radius:5px;padding:2px 6px;}
.state-msg{text-align:center;color:var(--text-muted);padding:60px 20px;font-size:14px;}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.gate-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:32px 28px;max-width:380px;width:100%;}
.gate-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--stitch);text-transform:uppercase;margin-bottom:6px;}
.gate-title{font-size:22px;font-weight:700;margin:0 0 6px;}
.gate-sub{font-size:13.5px;color:var(--text-muted);margin:0 0 22px;}
input,textarea{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
border-radius:8px;padding:11px 12px;font-size:14px;outline:none;}
input:focus,textarea:focus{border-color:var(--denim-light);}
label.field-label{display:block;font-size:11.5px;color:var(--text-muted);margin:12px 0 6px;}
.btn-primary{width:100%;background:var(--denim);border:1px solid var(--denim-light);color:var(--text);
border-radius:8px;padding:12px;font-size:14.5px;font-weight:700;margin-top:18px;}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.error-text{color:var(--danger);font-size:12.5px;margin-top:10px;}
.overlay{position:fixed;inset:0;background:rgba(6,8,12,.72);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:720px){.overlay{align-items:center;}}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;
max-width:480px;max-height:92vh;overflow-y:auto;}
@media(min-width:720px){.modal{border-radius:16px;}}
.modal-close{position:sticky;top:0;display:flex;justify-content:flex-end;padding:10px 12px 0;background:var(--panel);z-index:2;}
.modal-close button{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:999px;width:30px;height:30px;}
.gallery-main{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--panel-2);}
.thumb-row{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;}
.thumb{width:52px;height:68px;object-fit:cover;border-radius:6px;border:1px solid var(--border);flex-shrink:0;}
.thumb.active{border-color:var(--stitch);}
.modal-body{padding:4px 18px 20px;}
.swatch-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px;}
.swatch{border:1px solid var(--border);background:var(--panel-2);color:var(--text-muted);border-radius:7px;padding:6px 11px;font-size:12.5px;}
.swatch.active{border-color:var(--stitch);color:var(--stitch);}
.qty-row{display:flex;align-items:center;gap:12px;margin-top:18px;}
.qty-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-size:17px;font-weight:700;}
.qty-val{font-size:16px;font-weight:700;min-width:24px;text-align:center;}
.detail-line{display:flex;justify-content:space-between;font-size:13px;color:var(--text-muted);padding:5px 0;border-bottom:1px solid var(--border);}
.detail-line b{color:var(--text);font-weight:600;}
.cart-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.cart-item-remove{background:none;border:none;color:var(--danger);font-size:12px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ok);color:#0c1f14;
font-weight:700;font-size:13.5px;padding:12px 20px;border-radius:999px;z-index:60;}
.hidden{display:none !important;}
</style>
</head>
<body>

<!-- ====== SET THIS to your Apps Script /exec URL (Deploy > Manage deployments) ====== -->
<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwALzJCGLOKJmLVV8hOV2dCqXAQhVWeDUKTEXrbTJiBT3HTDJVheGFiNJRMeBo3OrQ/exec";
</script>

<div id="gate" class="gate">
  <form class="gate-card" id="gateForm">
    <div class="gate-eyebrow">RK Garg Jeans</div>
    <h1 class="gate-title">Wholesale Catalog</h1>
    <p class="gate-sub">G'Sir · LeBoys · Gargline — apna registered mobile number daalein</p>
    <label class="field-label">Mobile Number</label>
    <input type="tel" inputmode="numeric" placeholder="98XXXXXXXX" id="gateMobile" required />
    <button class="btn-primary" type="submit" id="gateBtn">Enter Catalog</button>
    <p class="error-text hidden" id="gateError"></p>
  </form>
</div>

<div id="app" class="hidden">
  <header class="header">
    <div class="header-row">
      <div class="brandmark">
        <span class="eyebrow">RK Garg Jeans</span>
        <span class="name">Wholesale Catalog</span>
      </div>
      <button class="cart-btn" id="cartOpenBtn">Request List <span class="badge hidden" id="cartBadge">0</span></button>
    </div>
  </header>

  <div class="filters">
    <div class="filter-group">
      <span class="filter-label">Brand</span>
      <div class="pill-row" id="brandPills"></div>
    </div>
    <div class="filter-group">
      <span class="filter-label">Category</span>
      <div class="pill-row" id="categoryPills"></div>
    </div>
  </div>

  <div class="container">
    <p class="state-msg hidden" id="loadingMsg">Loading catalog…</p>
    <p class="state-msg hidden" id="errorMsg"></p>
    <p class="state-msg hidden" id="emptyMsg">No products match these filters.</p>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div id="productOverlay" class="overlay hidden"></div>
<div id="cartOverlay" class="overlay hidden"></div>
<div id="toast" class="toast hidden"></div>

<script>
let products = [];
let brandFilter = "All";
let categoryFilter = "All";
let cart = [];
let activeProduct = null;
let activeImgIdx = 0;
let activeColor = "";
let activeQty = 1;
let mobile = "";
let firmName = "";

const $ = (id) => document.getElementById(id);

// ---------- restore session ----------
const saved = localStorage.getItem("rkg_session");
if (saved) {
  try {
    const s = JSON.parse(saved);
    mobile = s.mobile || "";
    firmName = s.firmName || "";
    showApp();
  } catch (e) {}
}

// ---------- gate ----------
$("gateForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const val = $("gateMobile").value;
  $("gateError").classList.add("hidden");
  $("gateBtn").disabled = true;
  $("gateBtn").textContent = "Checking...";
  try {
    const res = await fetch(APPS_SCRIPT_URL + "?action=checkAccess&mobile=" + encodeURIComponent(val));
    const data = await res.json();
    if (!data.found) {
      showGateError("Ye number hamare records mein nahi mila. Apne sales contact se access approve karwayein.");
      return;
    }
    if (!data.approved) {
      showGateError("Aapka access abhi pending / approved nahi hai. Thodi der mein try karein.");
      return;
    }
    mobile = val;
    firmName = data.firmName || "";
    localStorage.setItem("rkg_session", JSON.stringify({ mobile, firmName }));
    showApp();
  } catch (err) {
    showGateError("Kuch गड़बड़ ho gayi — dobara try karein.");
  } finally {
    $("gateBtn").disabled = false;
    $("gateBtn").textContent = "Enter Catalog";
  }
});

function showGateError(msg) {
  $("gateError").textContent = msg;
  $("gateError").classList.remove("hidden");
}

function showApp() {
  $("gate").classList.add("hidden");
  $("app").classList.remove("hidden");
  loadCatalog();
}

// ---------- catalog ----------
async function loadCatalog() {
  $("loadingMsg").classList.remove("hidden");
  $("errorMsg").classList.add("hidden");
  try {
    const res = await fetch(APPS_SCRIPT_URL + "?action=catalog");
    const data = await res.json();
    if (!data.success) throw new Error(data.error || "Could not load catalog");
    products = data.products;
    renderFilters();
    renderGrid();
  } catch (err) {
    $("errorMsg").textContent = "Couldn't load catalog: " + err.message;
    $("errorMsg").classList.remove("hidden");
  } finally {
    $("loadingMsg").classList.add("hidden");
  }
}

function renderFilters() {
  const brands = ["All", ...new Set(products.map(p => p.brand).filter(Boolean))];
  const categories = ["All", ...new Set(products.map(p => p.category).filter(Boolean))];
  $("brandPills").innerHTML = brands.map(b =>
    `<button class="pill ${b === brandFilter ? "active" : ""}" data-brand="${escapeAttr(b)}">${escapeHtml(b)}</button>`
  ).join("");
  $("categoryPills").innerHTML = categories.map(c =>
    `<button class="pill ${c === categoryFilter ? "active" : ""}" data-category="${escapeAttr(c)}">${escapeHtml(c)}</button>`
  ).join("");
  $("brandPills").querySelectorAll("button").forEach(btn =>
    btn.addEventListener("click", () => { brandFilter = btn.dataset.brand; renderFilters(); renderGrid(); })
  );
  $("categoryPills").querySelectorAll("button").forEach(btn =>
    btn.addEventListener("click", () => { categoryFilter = btn.dataset.category; renderFilters(); renderGrid(); })
  );
}

function renderGrid() {
  const filtered = products.filter(p =>
    (brandFilter === "All" || p.brand === brandFilter) &&
    (categoryFilter === "All" || p.category === categoryFilter)
  );
  $("emptyMsg").classList.toggle("hidden", filtered.length !== 0);
  $("grid").innerHTML = filtered.map(p => `
    <button class="card" data-sku="${escapeAttr(p.sku)}">
      <img class="card-img" src="${escapeAttr(p.mainImage || "")}" alt="${escapeAttr(p.sku)}" loading="lazy" />
      <div class="card-body">
        <div class="card-sku">${escapeHtml(p.sku)}</div>
        <div class="card-meta">${escapeHtml(p.brand || "")} ${p.category ? "· " + escapeHtml(p.category) : ""}</div>
        ${p.moq ? `<span class="card-moq">MOQ ${escapeHtml(p.moq)}</span>` : ""}
      </div>
    </button>
  `).join("");
  $("grid").querySelectorAll(".card").forEach(card =>
    card.addEventListener("click", () => openProduct(card.dataset.sku))
  );
}

// ---------- product modal ----------
function openProduct(sku) {
  activeProduct = products.find(p => p.sku === sku);
  if (!activeProduct) return;
  activeImgIdx = 0;
  activeColor = (activeProduct.colors && activeProduct.colors[0]) || "";
  activeQty = 1;
  renderProductModal();
}

function renderProductModal() {
  const p = activeProduct;
  const gallery = p.gallery && p.gallery.length ? p.gallery : [p.mainImage];
  $("productOverlay").innerHTML = `
    <div class="modal">
      <div class="modal-close"><button id="closeProduct">✕</button></div>
      <img class="gallery-main" src="${escapeAttr(gallery[activeImgIdx] || "")}" alt="${escapeAttr(p.sku)}" />
      ${gallery.length > 1 ? `<div class="thumb-row">${gallery.map((g,i) =>
        `<img src="${escapeAttr(g)}" class="thumb ${i===activeImgIdx?"active":""}" data-idx="${i}" />`
      ).join("")}</div>` : ""}
      <div class="modal-body">
        <div class="detail-line"><span>SKU</span><b>${escapeHtml(p.sku)}</b></div>
        <div class="detail-line"><span>Brand</span><b>${escapeHtml(p.brand||"")}</b></div>
        <div class="detail-line"><span>Fabric</span><b>${escapeHtml(p.fabric||"—")}</b></div>
        <div class="detail-line"><span>Sizes</span><b>${escapeHtml(p.sizes||"—")}</b></div>
        <div class="detail-line"><span>MOQ</span><b>${escapeHtml(p.moq||"—")}</b></div>
        ${p.colors && p.colors.length ? `
          <label class="field-label">Color</label>
          <div class="swatch-row">${p.colors.map(c =>
            `<button class="swatch ${c===activeColor?"active":""}" data-color="${escapeAttr(c)}">${escapeHtml(c)}</button>`
          ).join("")}</div>` : ""}
        <div class="qty-row">
          <button class="qty-btn" id="qtyMinus">−</button>
          <span class="qty-val" id="qtyVal">${activeQty}</span>
          <button class="qty-btn" id="qtyPlus">+</button>
        </div>
        <button class="btn-primary" id="addToCartBtn">Add to Request List</button>
      </div>
    </div>
  `;
  $("productOverlay").classList.remove("hidden");
  $("productOverlay").onclick = (e) => { if (e.target.id === "productOverlay") closeProduct(); };
  $("closeProduct").addEventListener("click", closeProduct);
  $("productOverlay").querySelectorAll(".thumb").forEach(t =>
    t.addEventListener("click", () => { activeImgIdx = Number(t.dataset.idx); renderProductModal(); })
  );
  $("productOverlay").querySelectorAll(".swatch").forEach(s =>
    s.addEventListener("click", () => { activeColor = s.dataset.color; renderProductModal(); })
  );
  $("qtyMinus").addEventListener("click", () => { activeQty = Math.max(1, activeQty-1); $("qtyVal").textContent = activeQty; });
  $("qtyPlus").addEventListener("click", () => { activeQty = activeQty+1; $("qtyVal").textContent = activeQty; });
  $("addToCartBtn").addEventListener("click", addToCart);
}

function closeProduct() {
  $("productOverlay").classList.add("hidden");
  $("productOverlay").innerHTML = "";
  activeProduct = null;
}

function addToCart() {
  const text = `Lot No-${activeProduct.sku}${activeColor ? " [Color: " + activeColor + "]" : ""}`;
  cart.push({ key: Date.now(), sku: activeProduct.sku, color: activeColor, qty: activeQty, text });
  updateCartBadge();
  showToast("Added to your request list");
  closeProduct();
}

function updateCartBadge() {
  const badge = $("cartBadge");
  if (cart.length > 0) {
    badge.textContent = cart.length;
    badge.classList.remove("hidden");
  } else {
    badge.classList.add("hidden");
  }
}

function showToast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  setTimeout(() => t.classList.add("hidden"), 1800);
}

// ---------- cart drawer ----------
$("cartOpenBtn").addEventListener("click", () => renderCartModal());

function renderCartModal(orderId) {
  let body;
  if (orderId) {
    body = `
      <p style="color:var(--ok);font-weight:700;">Request submitted — ${escapeHtml(orderId)}</p>
      <p class="card-meta">Hamari team jaldi hi aapse contact karegi.</p>
      <button class="btn-primary" id="continueBtn">Continue Browsing</button>
    `;
  } else if (cart.length === 0) {
    body = `<p class="state-msg">Abhi tak koi item add nahi kiya.</p>`;
  } else {
    body = `
      ${cart.map(c => `
        <div class="cart-item">
          <div>
            <div style="font-weight:600;font-size:13.5px;">${escapeHtml(c.text)}</div>
            <div class="card-meta">Qty: ${c.qty}</div>
          </div>
          <button class="cart-item-remove" data-key="${c.key}">Remove</button>
        </div>
      `).join("")}
      <label class="field-label">Firm Name</label>
      <input id="firmNameInput" value="${escapeAttr(firmName)}" />
      <label class="field-label">Remarks (optional)</label>
      <textarea id="remarksInput" rows="3"></textarea>
      <button class="btn-primary" id="submitOrderBtn">Submit Request</button>
      <p class="error-text hidden" id="submitError"></p>
    `;
  }

  $("cartOverlay").innerHTML = `
    <div class="modal">
      <div class="modal-close"><button id="closeCart">✕</button></div>
      <div class="modal-body">
        <h2 style="font-size:18px;margin-top:4px;">Your Request List</h2>
        ${body}
      </div>
    </div>
  `;
  $("cartOverlay").classList.remove("hidden");
  $("cartOverlay").onclick = (e) => { if (e.target.id === "cartOverlay") closeCart(); };
  $("closeCart").addEventListener("click", closeCart);

  if (orderId) {
    $("continueBtn").addEventListener("click", () => { closeCart(); });
  } else if (cart.length > 0) {
    $("cartOverlay").querySelectorAll(".cart-item-remove").forEach(btn =>
      btn.addEventListener("click", () => {
        cart = cart.filter(c => c.key !== Number(btn.dataset.key));
        updateCartBadge();
        renderCartModal();
      })
    );
    $("submitOrderBtn").addEventListener("click", submitOrder);
  }
}

function closeCart() {
  $("cartOverlay").classList.add("hidden");
  $("cartOverlay").innerHTML = "";
}

async function submitOrder() {
  const btn = $("submitOrderBtn");
  const errEl = $("submitError");
  errEl.classList.add("hidden");
  btn.disabled = true;
  btn.textContent = "Submitting...";
  firmName = $("firmNameInput").value;
  const remarks = $("remarksInput").value;
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: "submitOrder",
        payload: {
          mobile, firmName, remarks,
          items: cart.map(c => ({ text: c.text, qty: c.qty }))
        }
      })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || "Submit failed");
    localStorage.setItem("rkg_session", JSON.stringify({ mobile, firmName }));
    cart = [];
    updateCartBadge();
    renderCartModal(data.orderId);
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.remove("hidden");
  } finally {
    btn.disabled = false;
    btn.textContent = "Submit Request";
  }
}

// ---------- helpers ----------
function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function escapeAttr(str) { return escapeHtml(str); }
</script>
</body>
</html>
