<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RK Garg Jeans — Wholesale Catalog</title>
<meta property="og:title" content="RK Garg Jeans — Wholesale Catalog" />
<meta property="og:description" content="Wholesale catalog for G'Sir, LeBoys & Gargline." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0f16; --bg-2:#11151f;
  --panel:#171c28; --panel-2:#1d2331;
  --stage:#efe9dc;               /* warm off-white "spotlight" stage behind product photos */
  --denim:#3d6c9c; --denim-light:#6fa0d4;
  --brass:#cc9e56; --brass-dim:#7d5f2f;
  --gsir:#6fa0d4; --leboys:#cc9e56; --gargline:#8fa66a;
  --text:#f2f0e8; --text-muted:#8d97ab; --text-dim:#5d6479;
  --border:#262d3f; --border-light:#333c54;
  --danger:#d97361; --ok:#6fb98a;
  --radius:12px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:
  radial-gradient(1200px 500px at 50% -10%, #16203020, transparent),
  var(--bg);
  color:var(--text);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
h1,h2{font-family:"Oswald",sans-serif;}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes popIn{from{opacity:0;transform:scale(.97) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

/* ---------- header ---------- */
.header{position:sticky;top:0;z-index:20;background:rgba(23,28,40,.9);backdrop-filter:blur(10px);
border-bottom:1px solid var(--border);padding:16px 20px;}
.header-row{display:flex;align-items:center;justify-content:space-between;max-width:1240px;margin:0 auto;}
.brandmark{display:flex;align-items:center;gap:11px;line-height:1.1;}
.brandmark .rivet{width:34px;height:34px;border-radius:9px;background:linear-gradient(155deg,var(--denim),#274361);
display:flex;align-items:center;justify-content:center;font-family:"Oswald";font-weight:700;font-size:15px;
color:var(--brass);border:1px solid var(--border-light);flex-shrink:0;}
.brandmark .lockup{display:flex;flex-direction:column;}
.brandmark .eyebrow{font-size:10.5px;letter-spacing:.16em;color:var(--brass);text-transform:uppercase;font-weight:600;}
.brandmark .name{font-family:"Oswald";font-size:19px;font-weight:600;letter-spacing:.01em;}
.cart-btn{position:relative;background:var(--panel-2);color:var(--text);border:1px solid var(--border-light);
border-radius:999px;padding:10px 18px;font-size:13.5px;font-weight:600;letter-spacing:.02em;transition:border-color .15s,background .15s;}
.cart-btn:hover{border-color:var(--denim-light);background:#232a3c;}
.cart-btn .badge{position:absolute;top:-7px;right:-7px;background:var(--brass);color:#231a08;font-size:11px;
font-weight:800;border-radius:999px;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:0 4px;
box-shadow:0 0 0 3px var(--bg-2);}

/* ---------- filters ---------- */
.filters{max-width:1240px;margin:18px auto 0;padding:0 20px 16px;display:flex;gap:26px;flex-wrap:wrap;}
.filter-group{display:flex;flex-direction:column;gap:8px;}
.filter-label{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--text-dim);font-weight:600;}
.pill-row{display:flex;gap:7px;flex-wrap:wrap;}
.pill{border:1px solid var(--border-light);background:var(--panel);color:var(--text-muted);border-radius:999px;
padding:7px 15px;font-size:12.5px;font-weight:500;transition:all .15s;}
.pill:hover{border-color:var(--denim-light);color:var(--text);}
.pill.active{background:var(--denim);border-color:var(--denim-light);color:#fff;font-weight:600;}

/* ---------- grid ---------- */
.container{max-width:1240px;margin:0 auto;padding:22px 20px 90px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
text-align:left;padding:0;color:inherit;transition:transform .18s ease,border-color .18s,box-shadow .18s;
animation:fadeUp .35s ease backwards;}
.card:hover{transform:translateY(-4px);border-color:var(--denim-light);box-shadow:0 14px 30px -12px rgba(0,0,0,.55);}
.card-img-wrap{position:relative;background:var(--stage);}
.card-img{width:100%;aspect-ratio:4/3;object-fit:contain;display:block;padding:10px;}
.card-rivet{position:absolute;top:9px;left:9px;width:8px;height:8px;border-radius:50%;
background:var(--brass);opacity:.85;box-shadow:0 0 0 2px rgba(0,0,0,.15);}
.card-stitch{border-top:1px dashed var(--border-light);}
.card-body{padding:12px 14px 15px;}
.card-sku{font-family:"Oswald";font-size:14px;font-weight:600;letter-spacing:.01em;}
.card-meta-row{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;}
.brand-tag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;
border-radius:5px;background:rgba(255,255,255,.06);}
.category-txt{font-size:11.5px;color:var(--text-muted);}
.card-meta{font-size:11.5px;color:var(--text-muted);}
.card-price{font-family:"Oswald";font-size:15px;font-weight:600;color:var(--text);margin-top:8px;}
.card-price span{font-size:11px;font-weight:500;color:var(--text-muted);margin-left:5px;}
.card-sizes{font-size:11px;color:var(--text-muted);margin-top:4px;}
.card-moq{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:10.5px;font-weight:600;
color:var(--brass);letter-spacing:.02em;}
.card-moq::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--brass);}

.state-msg{text-align:center;color:var(--text-muted);padding:60px 20px;font-size:14px;}

/* ---------- gate ---------- */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;}
.gate::before{content:"";position:absolute;inset:0;background:
  radial-gradient(700px 400px at 20% 10%, rgba(61,108,156,.16), transparent),
  radial-gradient(600px 350px at 85% 90%, rgba(204,158,86,.10), transparent);pointer-events:none;}
.gate-card{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:18px;
padding:36px 30px;max-width:390px;width:100%;box-shadow:0 30px 60px -25px rgba(0,0,0,.6);animation:popIn .4s ease;}
.gate-rivet{width:44px;height:44px;border-radius:12px;background:linear-gradient(155deg,var(--denim),#274361);
display:flex;align-items:center;justify-content:center;font-family:"Oswald";font-weight:700;font-size:19px;
color:var(--brass);border:1px solid var(--border-light);margin-bottom:18px;}
.gate-eyebrow{font-size:11px;letter-spacing:.16em;color:var(--brass);text-transform:uppercase;margin-bottom:7px;font-weight:600;}
.gate-title{font-size:25px;font-weight:600;margin:0 0 8px;letter-spacing:.005em;}
.gate-sub{font-size:13.5px;color:var(--text-muted);margin:0 0 24px;line-height:1.5;}
.gate-est{font-size:11px;color:var(--text-dim);margin-top:22px;text-align:center;letter-spacing:.03em;}

input,textarea{width:100%;background:var(--panel-2);border:1px solid var(--border-light);color:var(--text);
border-radius:9px;padding:12px 13px;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s;}
input:focus,textarea:focus{border-color:var(--denim-light);box-shadow:0 0 0 3px rgba(111,160,212,.15);}
label.field-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);
font-weight:600;margin:14px 0 7px;}
.btn-primary{width:100%;background:linear-gradient(155deg,var(--denim),#2d5279);border:1px solid var(--denim-light);
color:#fff;border-radius:9px;padding:13px;font-size:14.5px;font-weight:600;letter-spacing:.01em;margin-top:20px;
transition:filter .15s,transform .1s;}
.btn-primary:hover{filter:brightness(1.1);}
.btn-primary:active{transform:scale(.99);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;filter:none;}
.error-text{color:var(--danger);font-size:12.5px;margin-top:11px;line-height:1.5;}

/* ---------- overlays / modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,7,11,.78);backdrop-filter:blur(2px);z-index:50;
display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .18s ease;}
@media(min-width:720px){.overlay{align-items:center;}}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;
max-width:480px;max-height:92vh;overflow-y:auto;animation:popIn .25s cubic-bezier(.2,.8,.3,1);}
@media(min-width:720px){.modal{border-radius:18px;max-width:660px;}}
.modal-close{position:sticky;top:0;display:flex;justify-content:flex-end;padding:12px 12px 0;
background:linear-gradient(var(--panel),var(--panel) 70%,transparent);z-index:2;}
.modal-close button{background:var(--panel-2);border:1px solid var(--border-light);color:var(--text);
border-radius:999px;width:32px;height:32px;font-size:14px;transition:border-color .15s;}
.modal-close button:hover{border-color:var(--denim-light);}
.gallery-stage{background:var(--stage);}
.gallery-main{width:100%;aspect-ratio:4/3;object-fit:contain;display:block;padding:16px;}
.thumb-row{display:flex;gap:9px;padding:14px 20px;overflow-x:auto;background:var(--panel);}
.thumb{width:58px;height:58px;object-fit:contain;background:var(--stage);border-radius:8px;
border:2px solid var(--border-light);flex-shrink:0;padding:4px;transition:border-color .15s;}
.thumb.active{border-color:var(--brass);}
.modal-body{padding:8px 24px 26px;}
.product-title{font-family:"Oswald";font-size:20px;font-weight:600;margin:6px 0 2px;}
.swatch-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.swatch{border:1px solid var(--border-light);background:var(--panel-2);color:var(--text-muted);
border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:500;transition:all .15s;}
.swatch:hover{border-color:var(--denim-light);}
.swatch.active{border-color:var(--brass);color:var(--brass);background:rgba(204,158,86,.08);font-weight:600;}
.color-chip.excluded{opacity:.45;text-decoration:line-through;border-style:dashed;background:transparent;}
.set-summary{margin-top:16px;background:var(--panel-2);border:1px solid var(--border-light);border-radius:10px;
padding:12px 14px;display:flex;flex-direction:column;gap:7px;}
.set-summary > div{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-muted);}
.set-summary b{color:var(--text);font-weight:600;font-family:"Oswald";}
.set-summary-total{border-top:1px dashed var(--border-light);padding-top:8px;margin-top:2px;}
.set-summary-total span, .set-summary-total b{color:var(--brass) !important;font-size:14px;}
.qty-row{display:flex;align-items:center;gap:14px;margin-top:22px;}
.qty-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border-light);background:var(--panel-2);
color:var(--text);font-size:18px;font-weight:700;transition:border-color .15s;}
.qty-btn:hover{border-color:var(--denim-light);}
.qty-val{font-size:17px;font-weight:700;min-width:26px;text-align:center;font-family:"Oswald";}
.detail-line{display:flex;justify-content:space-between;font-size:13px;color:var(--text-muted);
padding:8px 0;border-bottom:1px dashed var(--border);}
.detail-line b{color:var(--text);font-weight:600;}
.cart-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 0;
border-bottom:1px dashed var(--border);}
.cart-item-remove{background:none;border:none;color:var(--danger);font-size:12px;font-weight:600;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ok);color:#0c1f14;
font-weight:700;font-size:13.5px;padding:13px 22px;border-radius:999px;z-index:60;
box-shadow:0 12px 30px -10px rgba(0,0,0,.5);animation:popIn .2s ease;}
.hidden{display:none !important;}
</style>
</head>
<body>

<!-- ====== SET THIS to your Apps Script /exec URL (Deploy > Manage deployments) ====== -->
<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzXyjwzK_WqUnfvjgNPDjOeDFVbf9dA5MdjSghExOkHf3JVDK4HGPNNiMLGaMUjGI8/exec";
</script>

<div id="gate" class="gate">
  <form class="gate-card" id="gateForm">
    <div class="gate-rivet">RG</div>
    <div class="gate-eyebrow">RK Garg Jeans</div>
    <h1 class="gate-title">Wholesale Catalog</h1>
    <p class="gate-sub">G'Sir · LeBoys · Gargline — apna registered mobile number daalein</p>
    <label class="field-label">Mobile Number</label>
    <input type="tel" inputmode="numeric" placeholder="98XXXXXXXX" id="gateMobile" required />
    <button class="btn-primary" type="submit" id="gateBtn">Enter Catalog</button>
    <p class="error-text hidden" id="gateError"></p>
    <p class="gate-est">Manufacturing since 1989 · Delhi</p>
  </form>
</div>

<div id="app" class="hidden">
  <header class="header">
    <div class="header-row">
      <div class="brandmark">
        <div class="rivet">RG</div>
        <div class="lockup">
          <span class="eyebrow">RK Garg Jeans</span>
          <span class="name">Wholesale Catalog</span>
        </div>
      </div>
      <button class="cart-btn" id="cartOpenBtn">Request List <span class="badge hidden" id="cartBadge">0</span></button>
    </div>
  </header>

  <div class="filters">
    <div class="filter-group">
      <span class="filter-label">Brand</span>
      <div class="pill-row" id="brandPills"></div>
    </div>
    <div class="filter-group">
      <span class="filter-label">Category</span>
      <div class="pill-row" id="categoryPills"></div>
    </div>
  </div>

  <div class="container">
    <p class="state-msg hidden" id="loadingMsg">Loading catalog…</p>
    <p class="state-msg hidden" id="errorMsg"></p>
    <p class="state-msg hidden" id="emptyMsg">No products match these filters.</p>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div id="productOverlay" class="overlay hidden"></div>
<div id="cartOverlay" class="overlay hidden"></div>
<div id="toast" class="toast hidden"></div>

<script>
let products = [];
let brandFilter = "All";
let categoryFilter = "All";
let cart = [];
let activeProduct = null;
let activeImgIdx = 0;
let activeExcludedColors = [];   // colors the party has removed from the full set
let activeSets = 1;              // number of sets being ordered
let mobile = "";
let firmName = "";

const $ = (id) => document.getElementById(id);

// Distinct accent per brand — keeps the grid scannable at a glance
const BRAND_COLORS = { "G'Sir": "var(--gsir)", "LeBoys": "var(--leboys)", "Gargline": "var(--gargline)" };
function brandColor(brand) { return BRAND_COLORS[brand] || "var(--denim-light)"; }

// ---------- restore session ----------
const saved = localStorage.getItem("rkg_session");
if (saved) {
  try {
    const s = JSON.parse(saved);
    mobile = s.mobile || "";
    firmName = s.firmName || "";
    showApp();
  } catch (e) {}
}

// ---------- gate ----------
$("gateForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const val = $("gateMobile").value;
  $("gateError").classList.add("hidden");
  $("gateBtn").disabled = true;
  $("gateBtn").textContent = "Checking...";
  try {
    const res = await fetch(APPS_SCRIPT_URL + "?action=checkAccess&mobile=" + encodeURIComponent(val));
    const data = await res.json();
    if (!data.found) {
      showGateError("Ye number hamare records mein nahi mila. Apne sales contact se access approve karwayein.");
      return;
    }
    if (!data.approved) {
      showGateError("Aapka access abhi pending / approved nahi hai. Thodi der mein try karein.");
      return;
    }
    mobile = val;
    firmName = data.firmName || "";
    localStorage.setItem("rkg_session", JSON.stringify({ mobile, firmName }));
    showApp();
  } catch (err) {
    showGateError("Kuch गड़बड़ ho gayi — dobara try karein.");
  } finally {
    $("gateBtn").disabled = false;
    $("gateBtn").textContent = "Enter Catalog";
  }
});

function showGateError(msg) {
  $("gateError").textContent = msg;
  $("gateError").classList.remove("hidden");
}

function showApp() {
  $("gate").classList.add("hidden");
  $("app").classList.remove("hidden");
  loadCatalog();
}

// ---------- catalog ----------
async function loadCatalog() {
  $("loadingMsg").classList.remove("hidden");
  $("errorMsg").classList.add("hidden");
  try {
    const res = await fetch(APPS_SCRIPT_URL + "?action=catalog");
    const data = await res.json();
    if (!data.success) throw new Error(data.error || "Could not load catalog");
    products = data.products;
    renderFilters();
    renderGrid();
  } catch (err) {
    $("errorMsg").textContent = "Couldn't load catalog: " + err.message;
    $("errorMsg").classList.remove("hidden");
  } finally {
    $("loadingMsg").classList.add("hidden");
  }
}

function renderFilters() {
  const brands = ["All", ...new Set(products.map(p => p.brand).filter(Boolean))];
  const categories = ["All", ...new Set(products.map(p => p.category).filter(Boolean))];
  $("brandPills").innerHTML = brands.map(b =>
    `<button class="pill ${b === brandFilter ? "active" : ""}" data-brand="${escapeAttr(b)}">${escapeHtml(b)}</button>`
  ).join("");
  $("categoryPills").innerHTML = categories.map(c =>
    `<button class="pill ${c === categoryFilter ? "active" : ""}" data-category="${escapeAttr(c)}">${escapeHtml(c)}</button>`
  ).join("");
  $("brandPills").querySelectorAll("button").forEach(btn =>
    btn.addEventListener("click", () => { brandFilter = btn.dataset.brand; renderFilters(); renderGrid(); })
  );
  $("categoryPills").querySelectorAll("button").forEach(btn =>
    btn.addEventListener("click", () => { categoryFilter = btn.dataset.category; renderFilters(); renderGrid(); })
  );
}

function renderGrid() {
  const filtered = products.filter(p =>
    (brandFilter === "All" || p.brand === brandFilter) &&
    (categoryFilter === "All" || p.category === categoryFilter)
  );
  $("emptyMsg").classList.toggle("hidden", filtered.length !== 0);
  $("grid").innerHTML = filtered.map((p, i) => `
    <button class="card" data-sku="${escapeAttr(p.sku)}" style="animation-delay:${Math.min(i,10) * 30}ms">
      <div class="card-img-wrap">
        <span class="card-rivet"></span>
        <img class="card-img" src="${escapeAttr(p.mainImage || "")}" alt="${escapeAttr(p.sku)}" loading="lazy" />
      </div>
      <div class="card-stitch"></div>
      <div class="card-body">
        <div class="card-sku">${escapeHtml(p.sku)}</div>
        <div class="card-meta-row">
          ${p.brand ? `<span class="brand-tag" style="color:${brandColor(p.brand)}">${escapeHtml(p.brand)}</span>` : ""}
          ${p.category ? `<span class="category-txt">${escapeHtml(p.category)}</span>` : ""}
        </div>
        ${p.price ? `<div class="card-price">₹${escapeHtml(p.price)}<span>/ pc</span></div>` : ""}
        ${p.sizes ? `<div class="card-sizes">Sizes: ${escapeHtml(p.sizes)}</div>` : ""}
        ${p.moq ? `<span class="card-moq">MOQ ${escapeHtml(p.moq)}</span>` : ""}
      </div>
    </button>
  `).join("");
  $("grid").querySelectorAll(".card").forEach(card =>
    card.addEventListener("click", () => openProduct(card.dataset.sku))
  );
}

// ---------- product modal ----------
function openProduct(sku) {
  activeProduct = products.find(p => p.sku === sku);
  if (!activeProduct) return;
  activeImgIdx = 0;
  activeExcludedColors = [];
  activeSets = 1;
  renderProductModal();
}

function renderProductModal() {
  const p = activeProduct;
  const gallery = p.gallery && p.gallery.length ? p.gallery : [p.mainImage];
  const hasColors = p.colors && p.colors.length > 0;
  const includedColors = hasColors ? p.colors.filter(c => !activeExcludedColors.includes(c)) : [];
  const setSize = hasColors ? includedColors.length : 1;
  const totalPcs = setSize * activeSets;

  $("productOverlay").innerHTML = `
    <div class="modal">
      <div class="modal-close"><button id="closeProduct">✕</button></div>
      <div class="gallery-stage">
        <img class="gallery-main" src="${escapeAttr(gallery[activeImgIdx] || "")}" alt="${escapeAttr(p.sku)}" />
      </div>
      ${gallery.length > 1 ? `<div class="thumb-row">${gallery.map((g,i) =>
        `<img src="${escapeAttr(g)}" class="thumb ${i===activeImgIdx?"active":""}" data-idx="${i}" />`
      ).join("")}</div>` : ""}
      <div class="modal-body">
        <div class="product-title">${escapeHtml(p.sku)}</div>
        ${p.brand ? `<span class="brand-tag" style="color:${brandColor(p.brand)}">${escapeHtml(p.brand)}</span>` : ""}
        <div style="margin-top:14px;">
        <div class="detail-line"><span>Price</span><b>${p.price ? "₹" + escapeHtml(p.price) + " / pc" : "—"}</b></div>
        <div class="detail-line"><span>Fabric</span><b>${escapeHtml(p.fabric||"—")}</b></div>
        <div class="detail-line"><span>Sizes</span><b>${escapeHtml(p.sizes||"—")}</b></div>
        <div class="detail-line"><span>MOQ</span><b>${escapeHtml(p.moq||"—")}</b></div>
        </div>
        ${hasColors ? `
          <label class="field-label">Colours in this set — tap to remove</label>
          <div class="swatch-row">${p.colors.map(c => {
            const excluded = activeExcludedColors.includes(c);
            return `<button class="swatch color-chip ${excluded ? "excluded" : "active"}" data-color="${escapeAttr(c)}">${excluded ? "✕ " : "✓ "}${escapeHtml(c)}</button>`;
          }).join("")}</div>
          <div class="set-summary">
            <div><span>Colours selected</span><b>${includedColors.length} / ${p.colors.length}</b></div>
            <div><span>1 Set =</span><b>${setSize} pcs</b></div>
            <div><span>Sets</span><b id="setsVal">${activeSets}</b></div>
            <div class="set-summary-total"><span>Total</span><b>${totalPcs} Set${totalPcs > 1 ? "s" : ""}</b></div>
          </div>
          <div class="qty-row">
            <button class="qty-btn" id="qtyMinus">−</button>
            <span class="qty-val" id="qtyVal">${activeSets} Set${activeSets > 1 ? "s" : ""}</span>
            <button class="qty-btn" id="qtyPlus">+</button>
          </div>
        ` : `
          <div class="qty-row">
            <button class="qty-btn" id="qtyMinus">−</button>
            <span class="qty-val" id="qtyVal">${activeSets} pcs</span>
            <button class="qty-btn" id="qtyPlus">+</button>
          </div>
        `}
        <button class="btn-primary" id="addToCartBtn" ${hasColors && includedColors.length === 0 ? "disabled" : ""}>Add to Request List</button>
        ${hasColors && includedColors.length === 0 ? `<p class="error-text">Kam se kam ek colour rakhna zaroori hai.</p>` : ""}
      </div>
    </div>
  `;
  $("productOverlay").classList.remove("hidden");
  $("productOverlay").onclick = (e) => { if (e.target.id === "productOverlay") closeProduct(); };
  $("closeProduct").addEventListener("click", closeProduct);
  $("productOverlay").querySelectorAll(".thumb").forEach(t =>
    t.addEventListener("click", () => { activeImgIdx = Number(t.dataset.idx); renderProductModal(); })
  );
  $("productOverlay").querySelectorAll(".color-chip").forEach(s =>
    s.addEventListener("click", () => {
      const c = s.dataset.color;
      if (activeExcludedColors.includes(c)) {
        activeExcludedColors = activeExcludedColors.filter(x => x !== c);
      } else {
        activeExcludedColors = [...activeExcludedColors, c];
      }
      renderProductModal();
    })
  );
  $("qtyMinus").addEventListener("click", () => { activeSets = Math.max(1, activeSets-1); renderProductModal(); });
  $("qtyPlus").addEventListener("click", () => { activeSets = activeSets+1; renderProductModal(); });
  $("addToCartBtn").addEventListener("click", addToCart);
}

function closeProduct() {
  $("productOverlay").classList.add("hidden");
  $("productOverlay").innerHTML = "";
  activeProduct = null;
}

function addToCart() {
  const p = activeProduct;
  const hasColors = p.colors && p.colors.length > 0;
  const includedColors = hasColors ? p.colors.filter(c => !activeExcludedColors.includes(c)) : [];
  const setSize = hasColors ? includedColors.length : 1;
  const totalPcs = setSize * activeSets;

  let text;
  if (hasColors) {
    const isFullSet = includedColors.length === p.colors.length;
    const colorsPart = isFullSet
      ? `Full Set (${p.colors.length} Colours: ${p.colors.join(", ")})`
      : `${includedColors.length}/${p.colors.length} Colours: ${includedColors.join(", ")} — Removed: ${activeExcludedColors.join(", ")}`;
    text = `Lot No-${p.sku} — ${colorsPart} — ${activeSets} Set${activeSets > 1 ? "s" : ""} x ${setSize} pcs`;
  } else {
    text = `Lot No-${p.sku} — Qty: ${activeSets} pcs`;
  }

  cart.push({
    key: Date.now(),
    sku: p.sku,
    includedColors,
    excludedColors: [...activeExcludedColors],
    sets: activeSets,
    setSize,
    totalPcs,
    text
  });
  updateCartBadge();
  showToast("Added to your request list");
  closeProduct();
}

function updateCartBadge() {
  const badge = $("cartBadge");
  if (cart.length > 0) {
    badge.textContent = cart.length;
    badge.classList.remove("hidden");
  } else {
    badge.classList.add("hidden");
  }
}

function showToast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  setTimeout(() => t.classList.add("hidden"), 1800);
}

// ---------- cart drawer ----------
$("cartOpenBtn").addEventListener("click", () => renderCartModal());

function renderCartModal(orderId) {
  let body;
  if (orderId) {
    body = `
      <p style="color:var(--ok);font-weight:700;">Request submitted — ${escapeHtml(orderId)}</p>
      <p class="card-meta">Hamari team jaldi hi aapse contact karegi.</p>
      <button class="btn-primary" id="continueBtn">Continue Browsing</button>
    `;
  } else if (cart.length === 0) {
    body = `<p class="state-msg">Abhi tak koi item add nahi kiya.</p>`;
  } else {
    body = `
      ${cart.map(c => `
        <div class="cart-item">
          <div>
            <div style="font-weight:600;font-size:13.5px;">${escapeHtml(c.text)}</div>
            <div class="card-meta">Total: ${c.totalPcs} Set${c.totalPcs > 1 ? "s" : ""}</div>
          </div>
          <button class="cart-item-remove" data-key="${c.key}">Remove</button>
        </div>
      `).join("")}
      <label class="field-label">Firm Name</label>
      <input id="firmNameInput" value="${escapeAttr(firmName)}" />
      <label class="field-label">Remarks (optional)</label>
      <textarea id="remarksInput" rows="3"></textarea>
      <button class="btn-primary" id="submitOrderBtn">Submit Request</button>
      <p class="error-text hidden" id="submitError"></p>
    `;
  }

  $("cartOverlay").innerHTML = `
    <div class="modal">
      <div class="modal-close"><button id="closeCart">✕</button></div>
      <div class="modal-body">
        <h2 style="font-size:18px;margin-top:4px;">Your Request List</h2>
        ${body}
      </div>
    </div>
  `;
  $("cartOverlay").classList.remove("hidden");
  $("cartOverlay").onclick = (e) => { if (e.target.id === "cartOverlay") closeCart(); };
  $("closeCart").addEventListener("click", closeCart);

  if (orderId) {
    $("continueBtn").addEventListener("click", () => { closeCart(); });
  } else if (cart.length > 0) {
    $("cartOverlay").querySelectorAll(".cart-item-remove").forEach(btn =>
      btn.addEventListener("click", () => {
        cart = cart.filter(c => c.key !== Number(btn.dataset.key));
        updateCartBadge();
        renderCartModal();
      })
    );
    $("submitOrderBtn").addEventListener("click", submitOrder);
  }
}

function closeCart() {
  $("cartOverlay").classList.add("hidden");
  $("cartOverlay").innerHTML = "";
}

async function submitOrder() {
  const btn = $("submitOrderBtn");
  const errEl = $("submitError");
  errEl.classList.add("hidden");
  btn.disabled = true;
  btn.textContent = "Submitting...";
  firmName = $("firmNameInput").value;
  const remarks = $("remarksInput").value;
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: "submitOrder",
        payload: {
          mobile, firmName, remarks,
          items: cart.map(c => ({ text: c.text, qty: c.totalPcs }))
        }
      })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || "Submit failed");
    localStorage.setItem("rkg_session", JSON.stringify({ mobile, firmName }));
    cart = [];
    updateCartBadge();
    renderCartModal(data.orderId);
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.remove("hidden");
  } finally {
    btn.disabled = false;
    btn.textContent = "Submit Request";
  }
}

// ---------- helpers ----------
function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function escapeAttr(str) { return escapeHtml(str); }
</script>
</body>
</html>
